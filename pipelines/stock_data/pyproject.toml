[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-pipeline"
version = "2.0.0"
description = "Stealth web scraper suite for financial market data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Market Data Pipeline" }]
license = { text = "MIT" }
dependencies = [
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "sqlalchemy>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
stealth = ["curl_cffi>=0.7.0"]
full = ["curl_cffi>=0.7.0", "matplotlib>=3.7.0", "jupyter>=1.0.0"]
test = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "pytest-mock>=3.10.0"]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
