<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integrated Market Platform — UX Prototype V0.6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body>
    <div id="app">
      <div class="mock-banner" role="status">
        UX Prototype V0.6 — static mock data, not live · Planning artifact only ·
        <a href="../../README.md" style="color: #c9b8e8">docs/product/ux</a>
      </div>

      <header class="context-bar" aria-label="Global context">
        <div class="context-bar__left">
          <span class="badge badge--live" id="context-mode" aria-label="Mode: Live">● LIVE</span>
          <span>AS OF <strong id="context-as-of">10:42:18.328 ET</strong></span>
          <span id="context-symbol" style="color: var(--text-secondary)"></span>
          <span id="context-quality"><span class="badge badge--good">GOOD</span></span>
        </div>
        <div class="context-bar__right">
          <button type="button" class="btn btn--sm btn--ghost" id="open-shortcuts" title="Keyboard shortcuts (?)">
            ?
          </button>
          <button type="button" class="btn btn--sm" id="open-command" title="Command palette (Ctrl+K)">
            ⌘K
          </button>
          <button type="button" class="btn btn--sm btn--ghost" id="toggle-replay" title="Enter replay mode">
            Replay
          </button>
        </div>
      </header>

      <div id="replay-host"></div>

      <div class="main-layout" id="main-layout">
        <main class="main-content" id="main-content" tabindex="-1"></main>
      </div>

      <nav class="primary-nav" aria-label="Primary navigation">
        <div class="primary-nav__links">
          <a href="#/now" class="primary-nav__link is-active" data-nav="now">NOW</a>
          <a href="#/explore" class="primary-nav__link" data-nav="explore">EXPLORE</a>
          <a href="#" class="primary-nav__link is-disabled" data-nav="workspace">WORKSPACE</a>
          <a href="#" class="primary-nav__link is-disabled" data-nav="research">RESEARCH</a>
          <a href="#" class="primary-nav__link is-disabled" data-nav="portfolio">PORTFOLIO</a>
        </div>
        <div class="primary-nav__actions">
          <button type="button" class="btn btn--sm btn--ghost" disabled title="AI sidecar — not in prototype">
            AI
          </button>
          <button
            type="button"
            class="btn btn--sm btn--ghost"
            id="open-inspector-btn"
            title="Evidence Inspector (I)"
          >
            ℹ Inspector
          </button>
        </div>
      </nav>
    </div>

    <div id="drawer-host"></div>
    <div id="command-host"></div>
    <div id="quality-host"></div>
    <div id="shortcuts-host"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
