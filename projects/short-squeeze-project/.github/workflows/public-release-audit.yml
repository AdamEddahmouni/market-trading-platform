# Public Release Audit

name: Public Release Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit short-squeeze-core
        run: python short-squeeze-core/tools/release_audit.py short-squeeze-core
