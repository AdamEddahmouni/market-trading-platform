name: imp-validate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: imp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash 1.7.12)
        shell: bash
      - name: Lint workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  validate-python:
    uses: ./.github/workflows/imp-python.yml
    with:
      mode: fast
      workers: "2"

  validate-python-changed:
    uses: ./.github/workflows/imp-python.yml
    with:
      mode: changed
      workers: "2"

  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check documentation links
        run: python tools/check_docs_links.py

  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Typecheck, test, and build UI
        working-directory: ui
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
