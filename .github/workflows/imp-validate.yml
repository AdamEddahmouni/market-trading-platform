name: IMP Validation

on:
  push:
    paths:
      - "projects/integrated-market-platform/**"
      - ".github/workflows/imp-validate.yml"
  pull_request:
    paths:
      - "projects/integrated-market-platform/**"
      - ".github/workflows/imp-validate.yml"

defaults:
  run:
    working-directory: projects/integrated-market-platform

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install numpy pymongo scikit-learn tzdata

      - name: Platform P0 tests
        run: python -m unittest tests/platform/test_paper_p0.py -v

      - name: UI-001 API tests
        run: python -m unittest tests/ui1/test_ui_api.py -v

      - name: Phase 0 no-live registry
        run: python -m unittest tests/phase0/test_registry.py tests/phase0/test_analysis.py -v

      - name: Manifest validation (changed)
        run: python tools/validate.py changed

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/integrated-market-platform/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: projects/integrated-market-platform/ui
        run: npm ci

      - name: Typecheck and build UI
        working-directory: projects/integrated-market-platform/ui
        run: npm run build
