name: imp-validate

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fast + changed validation
        run: |
          python tools/validate.py fast
          python tools/validate.py changed
      - name: Docs link check
        run: python tools/check_docs_links.py

  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install and test UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
