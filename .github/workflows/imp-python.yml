name: imp-python-validation

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      workers:
        required: false
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout admitted replay fixture
        uses: actions/checkout@v4
        with:
          repository: AdamEddahmouni/short-squeeze-screener-internship
          ref: ee4de9f09128b6316c9d122da3af0fe4707fc0f0
          path: short-squeeze-project
          sparse-checkout: short-squeeze-core/tests/fixtures/validation/outcome_amendment/biya_market_bars_intraday.jsonl
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy pymongo scikit-learn
      - name: Cache Python validation state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .pytest_cache
          key: imp-python-${{ runner.os }}-${{ hashFiles('phase0-dependency-lock.json') }}
      - name: Select merge-base paths
        if: inputs.mode == 'changed'
        shell: bash
        run: |
          mkdir -p .local/developer-workflow
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          git diff --name-only "$base...${{ github.sha }}" > .local/developer-workflow/changed-paths.txt
          printf 'Selected %s changed paths\n' "$(wc -l < .local/developer-workflow/changed-paths.txt)"
      - name: Run manifest validation
        shell: bash
        run: |
          mkdir -p .local/developer-workflow
          if [[ "${{ inputs.mode }}" == "changed" ]]; then
            python tools/imp.py validate changed \
              --paths-file .local/developer-workflow/changed-paths.txt \
              --workers "${{ inputs.workers }}" \
              --json .local/developer-workflow/validation.json
          else
            python tools/imp.py validate "${{ inputs.mode }}" \
              --workers "${{ inputs.workers }}" \
              --json .local/developer-workflow/validation.json
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp-python-${{ inputs.mode }}
          path: .local/developer-workflow/
          if-no-files-found: ignore
