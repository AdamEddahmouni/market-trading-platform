name: imp-python-validation

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      workers:
        required: false
        default: "2"
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/integrated-market-platform

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository (full history)
        if: inputs.mode == 'changed'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout repository (shallow)
        if: inputs.mode != 'changed'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select merge-base paths
        if: inputs.mode == 'changed'
        shell: bash
        run: |
          mkdir -p .local/developer-workflow
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          git diff --name-only "$base...${{ github.sha }}" | sed 's#^projects/integrated-market-platform/##' > .local/developer-workflow/changed-paths.txt
          printf 'Selected %s changed paths\n' "$(wc -l < .local/developer-workflow/changed-paths.txt)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/integrated-market-platform/phase0-dependency-lock.json
      - name: Classify CI slices
        if: inputs.mode == 'changed'
        id: ci_slices
        shell: bash
        run: |
          mkdir -p .local/developer-workflow
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            python tools/ci_job_selector.py --always-run --quiet \
              --github-output \
              --json .local/developer-workflow/ci-job-selection.json
            exit 0
          fi
          python tools/ci_job_selector.py \
            --paths-file .local/developer-workflow/changed-paths.txt \
            --quiet \
            --github-output \
            --json .local/developer-workflow/ci-job-selection.json
      - name: Checkout admitted replay fixture
        if: inputs.mode == 'changed' && steps.ci_slices.outputs.checkout_replay_fixture == 'true'
        uses: actions/checkout@v4
        with:
          repository: AdamEddahmouni/short-squeeze-screener-internship
          ref: ee4de9f09128b6316c9d122da3af0fe4707fc0f0
          path: short-squeeze-project
          persist-credentials: false
          sparse-checkout: |
            short-squeeze-core/src
            short-squeeze-core/tests/fixtures/validation/outcome_amendment/biya_market_bars_intraday.jsonl
          sparse-checkout-cone-mode: false
      - name: Expose admitted replay fixture at collection root
        if: inputs.mode == 'changed' && steps.ci_slices.outputs.checkout_replay_fixture == 'true'
        shell: bash
        run: ln -s "$GITHUB_WORKSPACE/short-squeeze-project" "$GITHUB_WORKSPACE/../short-squeeze-project"
      - name: Cache Python validation state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            projects/integrated-market-platform/.pytest_cache
          key: imp-python-${{ runner.os }}-${{ hashFiles('projects/integrated-market-platform/phase0-dependency-lock.json') }}
          restore-keys: |
            imp-python-${{ runner.os }}-
      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy pymongo scikit-learn
      - name: Run manifest validation
        shell: bash
        run: |
          mkdir -p .local/developer-workflow
          if [[ "${{ inputs.mode }}" == "changed" ]]; then
            python tools/imp.py validate changed \
              --paths-file .local/developer-workflow/changed-paths.txt \
              --workers "${{ inputs.workers }}" \
              --json .local/developer-workflow/validation.json
          else
            python tools/imp.py validate "${{ inputs.mode }}" \
              --workers "${{ inputs.workers }}" \
              --json .local/developer-workflow/validation.json
          fi
      - name: Summarize performance telemetry
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".local/developer-workflow")
          receipt_path = root / "validation.json"
          summary = {
              "schema_version": "1.0",
              "report_type": "ci_performance_telemetry_summary",
              "remote_status": "REMOTE_UNMEASURED",
              "gating_policy": "OBSERVE_ONLY",
          }
          if receipt_path.is_file():
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              perf = receipt.get("performance_telemetry", {})
              summary.update(
                  {
                      "validation_mode": receipt.get("mode"),
                      "wall_seconds": perf.get("wall_seconds", receipt.get("wall_seconds")),
                      "classification": perf.get("budget", {}).get("classification"),
                      "workload_id": perf.get("budget", {}).get("workload_id"),
                      "environment": perf.get("environment", {}),
                  }
              )
          (root / "ci-performance-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imp-python-${{ inputs.mode }}
          path: projects/integrated-market-platform/.local/developer-workflow/
          if-no-files-found: ignore
