name: Monorepo Guardrails

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash 1.7.12)
        shell: bash
      - name: Lint root workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color .github/workflows/imp-validate.yml .github/workflows/monorepo-guardrails.yml
        shell: bash

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate workspace manifest and snapshots
        run: python tools/monorepo_guard.py validate --ci

      - name: Validate committed history audit
        run: python tools/generate_history_ledger.py validate --ci

      - name: Run guard tests
        run: python -m unittest tests.test_monorepo_guard tests.test_history_ledger -v
