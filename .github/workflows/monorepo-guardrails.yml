name: Monorepo Guardrails

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate workspace manifest and snapshots
        run: python tools/monorepo_guard.py validate --ci

      - name: Run guard tests
        run: python -m unittest tests.test_monorepo_guard -v
